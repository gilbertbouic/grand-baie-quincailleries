name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Pages to short shop slugs only
        run: |
          rm -rf "Hardware shops" Pharmacies Beauty inbox playbook sales
          rm -f equipe/termes.html equipe/prospects.html
          rm -f _build_sites.py _build_carwash.py tmp_*.jpg audit.docx
          rm -rf screenshots
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
